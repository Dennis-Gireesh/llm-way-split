name: waysplit

services:
  waysplit:
    image: ${WAYSPLIT_IMAGE:-waysplit:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WAYSPLIT_VERSION:-0.1.0}
        VCS_REF: ${WAYSPLIT_VCS_REF:-local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAYSPLIT_HOST_PORT:-9876}:9876"
    environment:
      WAYSPLIT_HOST: 0.0.0.0
      WAYSPLIT_PORT: "9876"
      WAYSPLIT_DATA_DIR: /data
      WAYSPLIT_MODEL_ENDPOINTS: ${WAYSPLIT_MODEL_ENDPOINTS:-http://host.docker.internal:11434,http://host.docker.internal:8080,http://ollama:11434}
      WAYSPLIT_MODEL_API_KEY: ${WAYSPLIT_MODEL_API_KEY:-}
      WAYSPLIT_MODEL_TIMEOUT_SECONDS: ${WAYSPLIT_MODEL_TIMEOUT_SECONDS:-300}
      WAYSPLIT_RETAIN_SOURCE: ${WAYSPLIT_RETAIN_SOURCE:-false}
      WAYSPLIT_MAX_UPLOAD_MIB: ${WAYSPLIT_MAX_UPLOAD_MIB:-25}
      WAYSPLIT_MAX_PAGES: ${WAYSPLIT_MAX_PAGES:-24}
      WAYSPLIT_RECONCILIATION_TOLERANCE: ${WAYSPLIT_RECONCILIATION_TOLERANCE:-0.00}
      WAYSPLIT_MINIMUM_EXTRACTION_CONFIDENCE: ${WAYSPLIT_MINIMUM_EXTRACTION_CONFIDENCE:-0.80}
      WAYSPLIT_REQUIRE_CHARGE_EVIDENCE: ${WAYSPLIT_REQUIRE_CHARGE_EVIDENCE:-true}
      WAYSPLIT_ALLOWED_ORIGINS: ${WAYSPLIT_ALLOWED_ORIGINS:-http://127.0.0.1:9876,http://localhost:9876}
      WAYSPLIT_TRUST_PROXY_HEADERS: ${WAYSPLIT_TRUST_PROXY_HEADERS:-false}
      WAYSPLIT_LOG_LEVEL: ${WAYSPLIT_LOG_LEVEL:-INFO}
    volumes:
      - waysplit-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - waysplit-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 256
    mem_limit: ${WAYSPLIT_APP_MEMORY_LIMIT:-1536m}
    cpus: ${WAYSPLIT_APP_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:9876/api/health', timeout=3); payload = json.load(response); raise SystemExit(0 if payload.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    profiles:
      - ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - waysplit-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${WAYSPLIT_OLLAMA_MEMORY_LIMIT:-16g}
    cpus: ${WAYSPLIT_OLLAMA_CPU_LIMIT:-8.0}
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  waysplit-network:
    driver: bridge

volumes:
  waysplit-data:
  ollama-data:
