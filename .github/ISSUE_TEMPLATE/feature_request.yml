name: Feature request
description: Propose a carrier-agnostic, local-first improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include real statements, secrets, phone numbers, account identifiers, or private household details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without private bill data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: trust
    attributes:
      label: Trust boundaries
      options:
        - label: The proposal remains local-first by default.
          required: true
        - label: External side effects remain previewed and explicitly confirmed.
          required: true
        - label: Allocation, rounding, reconciliation, duplicate detection, and posting decisions remain deterministic.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
