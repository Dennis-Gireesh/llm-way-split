[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "waysplit"
version = "0.1.20"
description = "Local-first, carrier-agnostic mobile statement splitting with deterministic reconciliation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "WaySplit contributors" },
]
keywords = ["bill-splitting", "local-first", "ollama", "ocr", "splitwise"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pypdf==6.15.0",
  "pypdfium2==5.12.1",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "pytesseract==0.3.13",
  "pyyaml==6.0.3",
  "tenacity==9.1.4",
  "typer==0.27.1",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.16.2",
]

[project.scripts]
waysplit = "waysplit.cli:app"

[project.urls]
Homepage = "https://github.com/Dennis-Gireesh/llm-way-split"
Documentation = "https://github.com/Dennis-Gireesh/llm-way-split#readme"
Issues = "https://github.com/Dennis-Gireesh/llm-way-split/issues"
Source = "https://github.com/Dennis-Gireesh/llm-way-split"

[tool.hatch.build.targets.wheel]
packages = ["src/waysplit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101", # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["waysplit"]
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "pypdfium2.*", "pytesseract.*", "yaml.*"]
ignore_missing_imports = true
